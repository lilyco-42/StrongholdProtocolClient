name: build-clients

# 把《卫戍协议：盟约》的浏览器客户端打成 Windows 桌面版与 Android APK。
#
# 为什么不在 CI 里生成 payload：
#   payload = 游戏代码 + 260MB 素材（素材不在 git 里，靠 `npm run assets` 现下）。
#   我们服务器上那份素材是**补齐过的**（boss 骨架 / token 皮肤 / 盟约图标 共 17 个文件，
#   上游 fetch 列表里没有），所以 CI 必须用我们打包好的 payload，而不是现拉上游。
#   本机（服务器）生成 payload → 传 OSS → 这里只负责打包成 exe / apk。
#
# 产物：
#   stronghold-desktop-win  -> StrongholdProtocol-desktop.zip（解压即用，启动 ~0.3s）
#   stronghold-android-apk  -> app-release.apk（固定 upload key 签名，见 docs/ANDROID-SIGNING.md）

on:
  workflow_dispatch:
    inputs:
      payload_url:
        description: '客户端 payload 包（tar.gz，内含 index.html / js / assets / data …）'
        required: false
        default: 'https://dl.lain42.top/downloads/stronghold-protocol/client/sp-client-payload.tar.gz'
      server:
        description: '校验用：payload 内 runtime-config.js 应当指向的服务器'
        required: false
        default: 'sp.lain42.top'
      expect_app:
        description: '闸门：payload 内 build.json 的 game.app 必须等于此值；留空则要求等于本仓库 package.json 的 version'
        required: false
        default: ''
  # 以前这里还有 `push: tags: v*`。删掉的原因是它会自己咬自己：`publish-client` 发布玩家版那一步会建 git tag
  # （v0.2.3-c33 这种），tag 一出现就再触发一次全量构建 —— 而那次用的是这个输入的**默认值**，
  # 也就是 dl.lain42.top 那个已经 403 的旧 OSS 地址。结果是"发一次版，多一跑错料的构建"，
  # 产物还不能对应真正的 payload。出哪个 payload 必须说清楚，所以这条 lane 只接受显式派发。
  # 出处与发布由 publish-client.yml 收口（它核对六个 URL 与每条资产的 sha256）。

env:
  NODE_VERSION: '22'

jobs:
  # ---------- Windows 桌面版 ----------
  desktop:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: 下载并解压 payload
        shell: bash
        run: |
          set -euo pipefail
          URL="${{ github.event.inputs.payload_url }}"
          [ -n "$URL" ] || URL="https://dl.lain42.top/downloads/stronghold-protocol/client/sp-client-payload.tar.gz"
          echo "payload: $URL"
          mkdir -p build/client/www
          curl -fL --retry 3 --retry-delay 3 "$URL" -o payload.tar.gz
          ls -lh payload.tar.gz
          tar -xzf payload.tar.gz -C build/client/www
          echo "解压文件数: $(find build/client/www -type f | wc -l)"
          du -sh build/client/www

      - name: 校验 payload 完整性
        shell: bash
        run: |
          set -euo pipefail
          for f in index.html js/runtime-config.js js/shell/picker.js js/net.js dev/spine-probe.html dev/spine-probe.js; do
            test -f "build/client/www/$f" || { echo "缺 $f"; exit 1; }
          done
          ASSETS=$(find build/client/www/assets -type f 2>/dev/null | wc -l)
          echo "素材文件数: $ASSETS"
          test "$ASSETS" -gt 3000 || { echo "素材不完整（只有 $ASSETS 个）"; exit 1; }
          echo "--- runtime-config.js ---"
          cat build/client/www/js/runtime-config.js
          echo "--- build.json ---"
          cat build/client/www/build.json

      # 没有这一步，payload 停在旧版本时 CI 照样绿：exe/apk 会静默带着旧游戏代码发布（0.1.1 就是这么出门的）。
      - name: 校验 payload 版本（闸门）
        shell: bash
        run: |
          set -euo pipefail
          EXPECT="${{ github.event.inputs.expect_app }}"
          WANT_SERVER="${{ github.event.inputs.server }}"
          REPO=$(node -e 'console.log(require("./package.json").version)')
          APP=$(node -e 'console.log(require("./build/client/www/build.json").game.app)')
          GOT_SERVER=$(node -e 'console.log(require("./build/client/www/build.json").server)')
          echo "payload: game.app=$APP server=$GOT_SERVER ；本仓库 version=$REPO"
          if [ -n "$EXPECT" ]; then
            [ "$APP" = "$EXPECT" ] || { echo "闸门：要求 expect_app=${EXPECT}，payload 实为 $APP"; exit 1; }
          else
            [ "$APP" = "$REPO" ] || { echo "闸门：payload 是 ${APP}，本仓库已对齐 $REPO —— 换 payload，或传 expect_app=$APP 明确接受"; exit 1; }
          fi
          if [ -n "$WANT_SERVER" ]; then
            [ "$GOT_SERVER" = "$WANT_SERVER" ] || { echo "闸门：要求 server=${WANT_SERVER}，payload 实为 $GOT_SERVER"; exit 1; }
          fi

      # 装机玩家可能在 LAN、飞机上、或根本连不上字体主机；payload 里出现第三方主机就是回归（旧产物确实带着它出门）。
      # 版本号对得上不代表这份 payload 能追到提交：默认 payload_url 那份实测 describe="v0.1.3-dirty"。
      - name: payload 出处（闸门）
        shell: bash
        run: node tools/check-payload-provenance.mjs build/client/www

      - name: 零外部依赖（闸门）
        shell: bash
        run: node tools/check-payload-offline.mjs build/client/www

      - name: 装 Electron 依赖
        run: cd desktop && npm install

      - name: 打 Windows 目录版
        run: cd desktop && npm run pack

      - name: 校验产物
        shell: bash
        run: |
          set -euo pipefail
          test -f build/desktop/win-unpacked/StrongholdProtocol.exe || {
            echo "exe 没生成"; ls -R build/desktop | head -40; exit 1; }
          ls -lh build/desktop/win-unpacked/StrongholdProtocol.exe
          du -sh build/desktop/win-unpacked
          # 单文件版与安装器是同一次 electron-builder 的另外两个 target（win.target 里声明）。少一个就是配置漂了，
          # 不能只发目录版 —— 玩家要的"一个 exe 双击就跑"和"能卸载的安装包"是两种不同分发形态。
          # 按后缀匹配而不是拼版本号：名字里的版本来自 desktop/package.json，在这里再拼一次就是第二真源。
          compgen -G "build/desktop/*-portable.exe" > /dev/null || {
            echo "portable exe 没生成"; ls -l build/desktop; exit 1; }
          compgen -G "build/desktop/*-Setup.exe" > /dev/null || {
            echo "NSIS 安装包没生成"; ls -l build/desktop; exit 1; }
          ls -lh build/desktop/*.exe

      # 壳自己是 29 KB 的 asar，游戏那份 www 是它旁边的 resources/www —— 闸门要落在真正出厂的那份上。
      - name: 零外部依赖（产物内，闸门）
        shell: bash
        run: node tools/check-payload-offline.mjs build/desktop/win-unpacked/resources/www

      - name: 打包分发（7z，比 deflate 小）+ 收齐 Windows 三种形态
        shell: pwsh
        run: |
          7z a -mx=9 StrongholdProtocol-desktop.zip build/desktop/win-unpacked
          Copy-Item build/desktop/*-portable.exe,build/desktop/*-Setup.exe .
          Get-ChildItem StrongholdProtocol-desktop.zip,*-portable.exe,*-Setup.exe |
            Select-Object Name, @{n='MB';e={[math]::Round($_.Length/1MB,1)}}

      - uses: actions/upload-artifact@v4
        with:
          name: stronghold-desktop-win
          path: |
            StrongholdProtocol-desktop.zip
            StrongholdProtocol-*-portable.exe
            StrongholdProtocol-*-Setup.exe
          retention-days: 7

  # ---------- Android APK ----------
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      # 固定签名钥匙（见 docs/ANDROID-SIGNING.md）放在最前面：secret 坏掉时一分钟就红，不用等 SDK + npm + gradle
      # 二十分钟。keytool 只验证「这把钥匙能解开、别名在」，不打印任何私钥材料或口令。
      - name: 准备固定签名钥匙（release）
        env:
          KS_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KS_PASS: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          set -euo pipefail
          [ -n "${KS_B64:-}" ] || { echo "闸门：仓库缺 secret ANDROID_KEYSTORE_BASE64 —— 见 docs/ANDROID-SIGNING.md"; exit 1; }
          [ -n "${KS_PASS:-}" ] || { echo "闸门：仓库缺 secret ANDROID_KEYSTORE_PASSWORD"; exit 1; }
          mkdir -p mobile/android/keystore
          printf '%s' "$KS_B64" | base64 -d > mobile/android/keystore/upload-keystore.p12
          printf 'storeFile=keystore/upload-keystore.p12\nstorePassword=%s\nkeyAlias=stronghold\nkeyPassword=%s\n' "$KS_PASS" "$KS_PASS" > mobile/android/keystore.properties
          keytool -list -keystore mobile/android/keystore/upload-keystore.p12 -storepass "$KS_PASS" -alias stronghold > /dev/null
          echo "keystore 可解，别名 stronghold 存在"

      # 不用 android-actions/setup-android@v3：它会去装早已从 SDK 仓库下架的 legacy `tools` 包，
      # 报 `Warning: Failed to find package 'tools'` 然后 exit 1，整条 job 直接挂。
      # ubuntu-latest 镜像自带 Android SDK，补装我们要的 platform / build-tools 就够了。
      - name: 安装 Android SDK 组件
        run: |
          set -euo pipefail
          SDK="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          echo "SDK=$SDK"
          test -d "$SDK" || { echo "找不到 Android SDK"; exit 1; }
          SDKMANAGER=$(find "$SDK/cmdline-tools" -maxdepth 3 -name sdkmanager -type f | sort | tail -1)
          echo "sdkmanager=$SDKMANAGER"
          test -n "$SDKMANAGER" || { echo "找不到 sdkmanager"; exit 1; }
          echo "ANDROID_HOME=$SDK" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK" >> "$GITHUB_ENV"
          echo "$(dirname "$SDKMANAGER")" >> "$GITHUB_PATH"
          yes | "$SDKMANAGER" --licenses > /dev/null 2>&1 || true
          "$SDKMANAGER" --install "platforms;android-36" "build-tools;36.0.0" "platform-tools"
          echo "--- platforms ---"; ls "$SDK/platforms"
          echo "--- build-tools ---"; ls "$SDK/build-tools"

      - name: 下载并解压 payload
        run: |
          set -euo pipefail
          URL="${{ github.event.inputs.payload_url }}"
          [ -n "$URL" ] || URL="https://dl.lain42.top/downloads/stronghold-protocol/client/sp-client-payload.tar.gz"
          echo "payload: $URL"
          mkdir -p build/client/www
          curl -fL --retry 3 --retry-delay 3 "$URL" -o payload.tar.gz
          ls -lh payload.tar.gz
          tar -xzf payload.tar.gz -C build/client/www
          echo "解压文件数: $(find build/client/www -type f | wc -l)"

      - name: 校验 payload 完整性
        run: |
          set -euo pipefail
          for f in index.html js/runtime-config.js js/shell/picker.js js/net.js dev/spine-probe.html dev/spine-probe.js; do
            test -f "build/client/www/$f" || { echo "缺 $f"; exit 1; }
          done
          ASSETS=$(find build/client/www/assets -type f 2>/dev/null | wc -l)
          echo "素材文件数: $ASSETS"
          test "$ASSETS" -gt 3000 || { echo "素材不完整（只有 $ASSETS 个）"; exit 1; }
          echo "--- build.json ---"
          cat build/client/www/build.json

      # 与桌面 job 同一道闸门（旧 payload 会静默出门，见 desktop job 的注释）。
      - name: 校验 payload 版本（闸门）
        run: |
          set -euo pipefail
          EXPECT="${{ github.event.inputs.expect_app }}"
          WANT_SERVER="${{ github.event.inputs.server }}"
          REPO=$(node -e 'console.log(require("./package.json").version)')
          APP=$(node -e 'console.log(require("./build/client/www/build.json").game.app)')
          GOT_SERVER=$(node -e 'console.log(require("./build/client/www/build.json").server)')
          echo "payload: game.app=$APP server=$GOT_SERVER ；本仓库 version=$REPO"
          if [ -n "$EXPECT" ]; then
            [ "$APP" = "$EXPECT" ] || { echo "闸门：要求 expect_app=${EXPECT}，payload 实为 $APP"; exit 1; }
          else
            [ "$APP" = "$REPO" ] || { echo "闸门：payload 是 ${APP}，本仓库已对齐 $REPO —— 换 payload，或传 expect_app=$APP 明确接受"; exit 1; }
          fi
          if [ -n "$WANT_SERVER" ]; then
            [ "$GOT_SERVER" = "$WANT_SERVER" ] || { echo "闸门：要求 server=${WANT_SERVER}，payload 实为 $GOT_SERVER"; exit 1; }
          fi

      # 装机玩家可能在 LAN、飞机上、或根本连不上字体主机；payload 里出现第三方主机就是回归（旧产物确实带着它出门）。
      # 版本号对得上不代表这份 payload 能追到提交：默认 payload_url 那份实测 describe="v0.1.3-dirty"。
      - name: payload 出处（闸门）
        shell: bash
        run: node tools/check-payload-provenance.mjs build/client/www

      - name: 零外部依赖（闸门）
        shell: bash
        run: node tools/check-payload-offline.mjs build/client/www

      - name: 装 Capacitor 依赖
        run: cd mobile && npm install

      - name: Android 关闭 /media 别名（Capacitor 是纯静态宿主，解不了它）
        run: |
          set -euo pipefail
          F=build/client/www/js/runtime-config.js
          test -f "$F" || { echo "缺 $F"; exit 1; }
          grep -q "runtime-config" "$F" || true
          printf '\n// Capacitor serves www/ as plain static files, so the extension-less /media/… alias would 404\n// and every BGM/sfx would be silent. Keep the direct /assets/audio/… URLs (public/js/media.js gates on this).\nglobalThis.__SP_MEDIA_ALIAS__ = false;\n' >> "$F"
          grep -q "__SP_MEDIA_ALIAS__ = false" "$F" || { echo "flag 没写进去"; exit 1; }
          echo "android: /media alias disabled"

      - name: 同步 web 资源到 Android 工程
        run: cd mobile && npx cap sync android

      # release 而不是 debug：debug 包签的是 runner 现生成的一次性钥匙，每个构建都不同，所以玩家覆盖安装必报
      # INSTALL_FAILED_UPDATE_INCOMPATIBLE(-7)「与已安装应用签名不同」。app/build.gradle 在没有固定钥匙时会
      # 直接失败，不会静默出一个装不上的未签名包。
      - name: 打 APK（release，固定钥匙）
        run: |
          cd mobile/android
          chmod +x ./gradlew
          ./gradlew assembleRelease --no-daemon --stacktrace

      - name: 校验 APK
        run: |
          APK=mobile/android/app/build/outputs/apk/release/app-release.apk
          test -f "$APK" || { echo "APK 没生成"; find mobile/android/app/build -name '*.apk' 2>/dev/null; exit 1; }
          ls -lh "$APK"
          unzip -l "$APK" | grep -E 'assets/public/index.html|assets/public/assets/' | head -5

      # 「这次和上次是不是同一把钥匙」得是产物校验项，不能只是约定：apksigner 从 APK 里读出签名证书，
      # 与仓库记录的指纹对拍。换钥匙（或误用 debug 钥匙）在这里就红，而不是等玩家装不上才发现。
      - name: APK 签名就是那一把钥匙（闸门）
        run: |
          set -euo pipefail
          APK=mobile/android/app/build/outputs/apk/release/app-release.apk
          SDK="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          APKSIGNER=$(find "$SDK/build-tools" -maxdepth 3 -type f -name apksigner | sort | tail -1)
          echo "apksigner=$APKSIGNER"
          [ -n "$APKSIGNER" ] && [ -x "$APKSIGNER" ] || { echo "闸门：找不到 apksigner（build-tools）"; ls "$SDK/build-tools"; exit 1; }
          "$APKSIGNER" verify --print-certs "$APK" > sp-signature.txt
          cat sp-signature.txt
          WANT=$(tr -d ' \n\r' < mobile/android/upload-key-sha256.txt | tr 'A-F' 'a-f')
          GOT=$(sed -n 's/.*SHA-256 digest[: ]*\([0-9a-fA-F:]*\).*/\1/p' sp-signature.txt | head -1 | tr -d ':' | tr 'A-F' 'a-f')
          [ -n "$GOT" ] || { echo "闸门：apksigner 没给出 SHA-256 指纹"; exit 1; }
          [ "$GOT" = "$WANT" ] || { echo "闸门：APK 签名指纹 $GOT ≠ 仓库记录的 $WANT —— 换过钥匙？装了旧包的玩家会装不上"; exit 1; }
          "$APKSIGNER" verify "$APK"
          echo "签名指纹与仓库记录一致：$GOT"

      # APK 是把 www 压进 assets/public/ 的 zip：整包 grep 是 0 命中，必须按条目解开来查（已发布的那份就是这么漏网的）。
      - name: 零外部依赖（产物内，闸门）
        shell: bash
        run: node tools/check-payload-offline.mjs --zip mobile/android/app/build/outputs/apk/release/app-release.apk

      - uses: actions/upload-artifact@v4
        with:
          name: stronghold-android-apk
          path: mobile/android/app/build/outputs/apk/release/app-release.apk
          retention-days: 7

  # ---------- iPhone 版（**未签名** .ipa，玩家自己用 AltServer / SideStore 签）----------
  #
  # 为什么 CI 里不签名：免费个人签名用的是**玩家自己的 Apple ID**，我们替他签不了；
  # 花钱的开发者账号（TestFlight）是另一条路，这里不走。本仓库是 PUBLIC，所以 macos-latest 不额外计费。
  # 交付物 = `Payload/App.app` 压成的 .ipa，AltServer 读进去签好再装到手机（限制见 README「iOS」：7 天到期、
  # 最多 3 个自签应用、续签要连电脑）。
  #
  # 前面四道闸门与另两个 job 逐字一致（GitHub 的 workflow 不支持 YAML 锚点，所以只能抄；
  # 抄漏一处就是给玩家发一份没把关的包）。
  ios:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: 下载并解压 payload
        run: |
          set -euo pipefail
          URL="${{ github.event.inputs.payload_url }}"
          [ -n "$URL" ] || URL="https://dl.lain42.top/downloads/stronghold-protocol/client/sp-client-payload.tar.gz"
          echo "payload: $URL"
          mkdir -p build/client/www
          curl -fL --retry 3 --retry-delay 3 "$URL" -o payload.tar.gz
          ls -lh payload.tar.gz
          tar -xzf payload.tar.gz -C build/client/www
          echo "解压文件数: $(find build/client/www -type f | wc -l)"

      - name: 校验 payload 完整性
        run: |
          set -euo pipefail
          for f in index.html js/runtime-config.js js/shell/picker.js js/net.js dev/spine-probe.html dev/spine-probe.js; do
            test -f "build/client/www/$f" || { echo "缺 $f"; exit 1; }
          done
          ASSETS=$(find build/client/www/assets -type f 2>/dev/null | wc -l)
          echo "素材文件数: $ASSETS"
          test "$ASSETS" -gt 3000 || { echo "素材不完整（只有 $ASSETS 个）"; exit 1; }
          echo "--- build.json ---"
          cat build/client/www/build.json

      - name: 校验 payload 版本（闸门）
        run: |
          set -euo pipefail
          EXPECT="${{ github.event.inputs.expect_app }}"
          WANT_SERVER="${{ github.event.inputs.server }}"
          REPO=$(node -e 'console.log(require("./package.json").version)')
          APP=$(node -e 'console.log(require("./build/client/www/build.json").game.app)')
          GOT_SERVER=$(node -e 'console.log(require("./build/client/www/build.json").server)')
          echo "payload: game.app=$APP server=$GOT_SERVER ；本仓库 version=$REPO"
          if [ -n "$EXPECT" ]; then
            [ "$APP" = "$EXPECT" ] || { echo "闸门：要求 expect_app=${EXPECT}，payload 实为 $APP"; exit 1; }
          else
            [ "$APP" = "$REPO" ] || { echo "闸门：payload 是 ${APP}，本仓库已对齐 $REPO —— 换 payload，或传 expect_app=$APP 明确接受"; exit 1; }
          fi
          if [ -n "$WANT_SERVER" ]; then
            [ "$GOT_SERVER" = "$WANT_SERVER" ] || { echo "闸门：要求 server=${WANT_SERVER}，payload 实为 $GOT_SERVER"; exit 1; }
          fi

      - name: payload 出处（闸门）
        shell: bash
        run: node tools/check-payload-provenance.mjs build/client/www

      - name: 零外部依赖（闸门）
        shell: bash
        run: node tools/check-payload-offline.mjs build/client/www

      - name: 装 Capacitor 依赖
        run: cd mobile && npm install

      # 与 Android 同一件事：WKWebView 也是纯静态宿主，解不了无扩展名的 /media/…，不关掉就是全程静音。
      - name: iOS 关闭 /media 别名
        run: |
          set -euo pipefail
          F=build/client/www/js/runtime-config.js
          test -f "$F" || { echo "缺 $F"; exit 1; }
          printf '\n// Capacitor on iOS serves www/ as plain static files too, so the extension-less /media/… alias\n// would 404 and every BGM/sfx would be silent. Keep the direct /assets/audio/… URLs.\nglobalThis.__SP_MEDIA_ALIAS__ = false;\n' >> "$F"
          grep -q "__SP_MEDIA_ALIAS__ = false" "$F" || { echo "flag 没写进去"; exit 1; }
          echo "ios: /media alias disabled"

      - name: 同步 web 资源到 iOS 工程
        run: cd mobile && npx cap sync ios

      # 不签名：CODE_SIGNING_ALLOWED=NO 让 xcodebuild 只编译，产物交给玩家自己的 AltServer 去签。
      # scheme 是仓库里那份 App.xcscheme（模板不带共享 scheme，纯 CI 环境下 xcodebuild 不会替你生成）。
      - name: 编 .app（不签名）
        run: |
          set -euo pipefail
          cd mobile/ios/App
          xcodebuild -list -project App.xcodeproj
          xcodebuild -project App.xcodeproj -scheme App -configuration Release \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY= PROVISIONING_PROFILE_SPECIFIER= \
            build

      - name: 打成 .ipa（并跑产物内闸门）
        run: |
          set -euo pipefail
          APP=$(find mobile/ios/App/build/Build/Products -maxdepth 2 -name 'App.app' -type d | head -1)
          test -n "$APP" || { echo "没编出 .app"; find mobile/ios/App/build -maxdepth 4 -name '*.app' | head; exit 1; }
          echo "App: $APP  $(du -sh "$APP" | cut -f1)"
          # 包内 Web 资源在哪个目录由 Capacitor 决定（wwwFolderName），找不到就报错，别拿空目录去"通过"闸门。
          WWW=$(find "$APP" -maxdepth 1 -type d -name public | head -1)
          test -n "$WWW" || { echo "在 .app 里找不到 public/ 目录"; ls "$APP"; exit 1; }
          test -f "$WWW/index.html" || { echo "$WWW 里没有 index.html"; exit 1; }
          echo "包内 Web 资源: ${WWW}（index.html $(wc -c < "$WWW/index.html") B）"
          node tools/check-payload-offline.mjs "$WWW"
          test -f "$WWW/js/shell/picker.js" || { echo "包里没选择页"; exit 1; }
          grep -q "COMMUNITY_SERVERS" "$WWW/js/shell/picker-core.js" || { echo "包里没网友服播种表"; exit 1; }
          rm -rf ipa && mkdir -p ipa/Payload
          cp -R "$APP" ipa/Payload/
          VER=$(node -e 'console.log(require("./package.json").version)')
          OUT="Stronghold-$VER-ios-unsigned.ipa"
          (cd ipa && ditto -c -k --keepParent Payload "../$OUT")
          ls -lh "$OUT"
          unzip -l "$OUT" | head -6
          mv "$OUT" Stronghold-ios-unsigned.ipa

      - uses: actions/upload-artifact@v4
        with:
          name: stronghold-ios-ipa
          path: Stronghold-ios-unsigned.ipa
          retention-days: 7
