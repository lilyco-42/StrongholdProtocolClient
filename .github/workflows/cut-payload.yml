name: cut-payload

# 在 GitHub 的 runner 上把「游戏仓某一支 + 已发布 payload 里那批素材」打成客户端 payload,不在本机打。
#
# 为什么原来不在 CI 打(build-clients.yml 的注释):payload = 游戏代码 + 素材,而素材不在 git 里,要靠现拉;
# 我们发出去的那份素材是**补齐过的**(boss 骨架 / token 皮肤 / 盟约图标等,上游 fetch 列表里没有),CI 现拉上游
# 会少掉这些文件。这个理由现在不成立了:**我们自己发布的 payload tar 就是那批补齐过的素材**,已经在 GitHub 上
# (`payload-v0.2.1-c29` 那份 599,987,165 B)。所以素材从上一版 payload 取,代码从游戏仓取,两者在 runner 上合体。
#
# 与 test-game-branch.yml 的分工:那条只跑游戏套件(素材拷进去就扔),这条产出文件。游戏 fork 自己没有 CI,
# 所以「合并上游之后 payload 还能不能打出来」这件事只有这里能证明 —— 尤其 `patches/game-client.patch` 的上下文
# 锚点:上游动过 `public/js/screens/room.js` 的 import 区,补丁就会在这里红,而不是打出一个连错服务器的包。
#
# 闸门(全部在这条 lane 里,任何一个红就不出包):
#   1) 素材按**输出文件数**验收,不看退出码(拷了 0 个文件的 cp 也退 0);
#   2) 游戏树 `git status --porcelain` 必须空 —— 否则 build.json 的 `game.dirty=true`,provenance 闸门红:
#      打了不该进包的 tracked 文件(通常是 fetch-assets 改写了 data/assets.json,那要回游戏仓提交,不能烤进包);
#   3) `tools/check-payload-provenance.mjs`:dirty=false 且 describe 带 `-g<sha>`;
#   4) `tools/check-payload-offline.mjs`:boot 路径里没有 fonts.googleapis/gstatic、没有 dl.lain42.top;
#   5) 补丁真的落到了包里(grep `__SP_SERVER__` / `toHttpUrl` / picker.js / runtime-config.js);
#   6) 自检页 `dev/spine-probe.html` 在包里(它没有入口就等于没发 —— c27 踩过)。
#
# publish=no 时只打印 sha256 与闸门结果、上传 build.json:第一次跑用它来验「补丁能不能打上」,
# 不产生任何对外可见的东西。publish=draft 才建 Draft Release(玩家看不到,要 `gh release edit --draft=false` 才发)。

on:
  workflow_dispatch:
    inputs:
      game_repo:
        description: '游戏仓(owner/name)'
        required: false
        default: 'lilyco-42/Stronghold-Protocol'
      game_ref:
        description: '游戏仓要打包的分支或 commit'
        required: true
        default: 'feat/skins'
      base_payload_release:
        description: '素材来自哪个已发布 payload Release 的 tar(补齐过的那批)'
        required: false
        default: 'payload-v0.2.1-c29'
      server:
        description: '写进 js/runtime-config.js 的默认服务器(发出去的产物要指向它)'
        required: false
        default: 'sp.lain42.top'
      out_tag:
        description: 'publish 非 no 时新建的 Release tag(必须是还不存在的名字,绝不覆盖已发布资产)'
        required: false
        default: 'payload-v0.2.2-c30'
      asset_name:
        description: 'tar 的资产文件名'
        required: false
        default: 'sp-client-payload-0.2.2-c30.tar.gz'
      publish:
        description: 'no=只过闸门并打印 / draft=建 Draft Release / ready=建 Release 并直接可下载'
        required: false
        default: 'no'
        type: choice
        options:
          - 'no'
          - 'draft'
          - 'ready'

env:
  NODE_VERSION: '22'

concurrency:
  group: cut-payload-${{ inputs.out_tag }}
  cancel-in-progress: false

jobs:
  cut:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: write      # publish!=no 时要建 Release;publish=no 时这一步也不会跑
    steps:
      - name: checkout 客户端仓(补丁与打包脚本在这里)
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: checkout 游戏仓(带 tag,provenance 要 `git describe`)
        uses: actions/checkout@v4
        with:
          repository: ${{ inputs.game_repo }}
          ref: ${{ inputs.game_ref }}
          path: game
          fetch-depth: 0
          fetch-tags: true

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: 取素材(从上一版 payload tar,不从上游现拉)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REL: ${{ inputs.base_payload_release }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/payload"
          # -R 必需:当前目录的 git remote 是客户端仓,而 Release 也在客户端仓 —— 但下一步起我们会 cd 到别处,
          # 显式写死比让 gh 推断便宜且不会指错。
          gh release download "$REL" -R lilyco-42/StrongholdProtocolClient -D "$RUNNER_TEMP/payload" -p '*.tar.gz'
          tar=$(ls "$RUNNER_TEMP/payload"/*.tar.gz | head -1)
          echo "素材来自 $tar($(stat -c %s "$tar") B)"
          mkdir -p "$RUNNER_TEMP/base"
          tar -xzf "$tar" -C "$RUNNER_TEMP/base"
          BASE=$(find "$RUNNER_TEMP/base" -type f | wc -l)
          echo "解出 $BASE 个文件"
          df -h "$RUNNER_TEMP" | tail -1
          test "$BASE" -gt 10000 || { echo "素材解包解出 $BASE 个文件 —— 这个数说明解包本身没成"; exit 1; }
          test -f "$RUNNER_TEMP/base/data/assets.json"

      - name: 把素材与派生登记放回游戏树
        working-directory: game
        run: |
          set -euo pipefail
          # public/assets|fonts|vendor 与 data/local-assets.json、data/voice-langs.json 都被 .gitignore 排除,
          # 新 clone 一个文件都没有 —— 而包里那 13k 个文件就是它们。派生登记跟着素材走,所以照抄上一版。
          for d in assets fonts vendor; do
            if [ -d "$RUNNER_TEMP/base/$d" ]; then
              mkdir -p "public/$d"
              cp -a "$RUNNER_TEMP/base/$d/." "public/$d/"
            fi
          done
          # 用 if 而不是 "[ -f … ] && cp":后者在文件不存在时返回非零,配合 set -e 会静默杀掉这一步。
          if [ -f "$RUNNER_TEMP/base/data/local-assets.json" ]; then cp "$RUNNER_TEMP/base/data/local-assets.json" data/local-assets.json; fi
          # data/voice-langs.json 是 0.1.4 时代的派生登记（语音语言菜单），0.2.0 用 packs/ + packs/index.json 取代了它：
          # 0.2.2 的树里没有 tools/voice-langs.mjs，也没有任何代码读这个文件（grep 整树零命中），而 packer 会把
          # checkout 的 data/ 原样摊进包 —— 于是从上一版 payload 把它拷回来 = 往包里塞一个树里不存在、也没人读的文件，
          # 还会让下面那道"树必须干净"的闸门每包都红（第一次跑就是被它挡下的：`?? data/voice-langs.json`）。
          # 所以这里**不拷**它：包应当正好反映那棵树，多余的字节也是多余的下载。
          A=$(find public/assets -type f | wc -l); V=$(find public/vendor -type f | wc -l); F=$(find public/fonts -type f | wc -l)
          echo "游戏树里的素材文件数 assets=$A vendor=$V fonts=$F"
          test "$A" -gt 10000 || { echo "assets 只拷进 $A 个(预期 1 万以上)—— 别打了,打出来是个没有立绘的包"; exit 1; }
          test "$V" -gt 3 || { echo "vendor 没拷进来,pixi/spine 相关的文件在包里会缺"; exit 1; }

      - name: 补增量素材(新版本清单里该有的文件)
        working-directory: game
        run: |
          set -euo pipefail
          # 必须先装依赖：fetch-assets 起手就要 @pixi-spine/runtime-3.8（解析 .skel 用），没有它它**一个文件都不下**
          # 就直接抛错。上一版这条不装依赖，那句 "|| echo 继续,靠已拷进来的那批" 把这件事压成一行 warn，
          # 于是 c33 一路走到离线闸门才红：12844 个 URL 里 313 个找不到（例如 assets/char/avatar/char_4231_clemnt.png，
          # 全是上游 0.2.3 新干员那批）。素材的真相在上一版 payload 里，但"新版本清单该有的文件"只能靠这一步补。
          # 用 npm ci 而不是 npm install：ci 从不改写 package-lock.json，install 会 —— 脏树打出来的包
          # provenance 闸门必红（c29 那次实测就是 ` M package-lock.json`）。
          npm ci --ignore-scripts --no-audit --no-fund
          rc=0
          node tools/fetch-assets.mjs 2>&1 | tail -25 || rc=$?
          if [ "$rc" != "0" ]; then
            echo "[fetch-assets] 退出码 $rc。继续，但缺的文件由下面的存在性闸门判红 —— 不是「靠已拷进来的那批」就算过。"
          fi
          # 它顺手会重写登记里的 hash/stats/bytes（有时还有 lock）。那些是要回游戏仓提交的东西，不许烤进 payload；
          # 丢弃前先把改了什么印出来，别做成静默的。
          for f in data/assets.json package-lock.json; do
            if ! git diff --quiet -- "$f" 2>/dev/null; then
              echo "（丢弃 fetch-assets 对 $f 的改写；要生效请回游戏仓提交并跑 npm test）"
              git diff --stat -- "$f" || true
              git checkout -- "$f"
            fi
          done
          find public/assets -type f | wc -l

      - name: 游戏树必须干净(打了不该打的东西就别出包)
        working-directory: game
        run: |
          set -euo pipefail
          # 依赖由上一步的 npm ci 装（node_modules 与被下载的素材都在 .gitignore 覆盖范围内，不会脏树）。
          # 这里守的是另一件事：tracked 文件被改动 = build.json 写 dirty:true，这份包就追不到 commit
          # （c29 那次实测是 ` M package-lock.json` —— 从这一步开始 lane 改用 npm ci，并把 fetch-assets 对
          #   data/assets.json / package-lock.json 的改写显式丢弃并打印，而不是让它把整条 lane 带脏）。
          git status --porcelain
          DIRTY=$(git status --porcelain | head -20)
          if [ -n "$DIRTY" ]; then
            echo "游戏树脏了 —— build.json 会写 dirty:true,这份包追不到 commit。"
            echo "若是 data/assets.json 被 fetch-assets 改写:那要回游戏仓提交,不能烤进 payload。"
            echo "若是 public/ 下多出未跟踪文件:检查 .gitignore 是否覆盖它。"
            exit 1
          fi
          echo "干净。HEAD=$(git rev-parse HEAD) describe=$(git describe --tags --always --dirty)"

      - name: 打 payload
        run: |
          set -euo pipefail
          node tools/package-client.mjs --game game --out "$RUNNER_TEMP/www" --server '${{ inputs.server }}' 2>&1 | tail -25
          find "$RUNNER_TEMP/www" -type f | wc -l

      - name: 闸门:出处 / 离线 / 补丁真的落进包里
        run: |
          set -euo pipefail
          OUT="$RUNNER_TEMP/www"
          # readFileSync 而不是 require:后者在 --eval 里靠 cwd 推 module.paths,不如显式路径直白。
          node -p "JSON.parse(require('fs').readFileSync('./game/package.json','utf8')).version" > /tmp/appver
          node tools/check-payload-provenance.mjs "$OUT" --expect-app "$(cat /tmp/appver)"
          node tools/check-payload-offline.mjs "$OUT"
          # 补丁没落到包里时上面两个闸门都是绿的(它俩看的是 build.json 与外链),所以这里直接 grep 那三处改动。
          grep -q '__SP_SERVER__' "$OUT/js/runtime-config.js"
          grep -q 'resolveServerTarget' "$OUT/js/net.js"
          grep -q 'toHttpUrl' "$OUT/js/screens/room.js"
          grep -q '/js/shell/picker.js' "$OUT/index.html"
          grep -q '/css/shell-display.css' "$OUT/index.html"
          test -f "$OUT/js/shell/picker.js"
          test -f "$OUT/js/shell/picker-core.js"
          # 自检页没有入口就等于没发(c27 的教训):文件在 + 按钮在,两个都要有。
          test -f "$OUT/dev/spine-probe.html" || { echo "包里缺 dev/spine-probe.html"; exit 1; }
          grep -q 'sp-selftest' "$OUT/js/shell/picker.js" || { echo "picker.js 里没有自检页入口"; exit 1; }
          echo "闸门通过:$(find "$OUT" -type f | wc -l) 个文件,$(du -sh "$OUT" | cut -f1)"

      - name: 拆成「美术 + 代码」两半，并证明拆开再合回去是逐字节同一份
        env:
          BASE: ${{ inputs.base_payload_release }}
          TAG: ${{ inputs.out_tag }}
        run: |
          set -euo pipefail
          OUT="$RUNNER_TEMP/www"
          # 为什么要这一刀：玩家每次升级真正变的只有代码，而包里 99% 的字节是美术（assets/ 一条目录就占
          # 13,342 个文件 / 约 800 MB）。自动更新只能搬"每次真的会换"的那部分，所以按一条明确的分界拆：
          # 美术 = ./assets（这条 lane 从上一版 payload 原样拷进来的那批）；其余全部进代码包（含 vendor/，
          # 上游换 pixi 版本时它必须能随增量一起走）。
          # 分界写在这里一次，客户端与这条闸门共用同一个约定，见 docs/AUTO-UPDATE.md。
          NAMEVER="${TAG#payload-}"
          CODE="sp-client-code-${NAMEVER}.tar.gz"
          MANIFEST="sp-client-manifest-${NAMEVER}.json"
          tar -czf "$RUNNER_TEMP/$CODE" -C "$OUT" --exclude=./assets .
          CODE_FILES=$(tar -tzf "$RUNNER_TEMP/$CODE" | grep -vc '/$' || true)
          ALL_FILES=$(find "$OUT" -type f | wc -l)
          ART_FILES=$(find "$OUT/assets" -type f | wc -l)
          echo "代码包 $CODE：$CODE_FILES 个文件 / $(du -h "$RUNNER_TEMP/$CODE" | cut -f1)；payload 共 $ALL_FILES 个，其中美术 $ART_FILES 个"
          # 拆分的阳性对照：把代码包解出来 + 原样放回美术，必须与 payload 逐字节相同。这条不成立就说明分界写错了
          # （漏了文件或排多了），那种增量发出去就是"有人更新后白屏"。
          rm -rf "$RUNNER_TEMP/verify" && mkdir -p "$RUNNER_TEMP/verify"
          tar -xzf "$RUNNER_TEMP/$CODE" -C "$RUNNER_TEMP/verify"
          cp -a "$OUT/assets" "$RUNNER_TEMP/verify/assets"
          diff -r "$OUT" "$RUNNER_TEMP/verify"
          echo "✓ 代码包 + 美术 = 原 payload（逐字节一致）"
          # 拆分的阴性对照：代码包如果其实什么都没拆出去，上面那条 diff 会**永远成立**、绿灯毫无意义。
          # 所以要求它确实少掉了美术那一档数量级。
          test "$CODE_FILES" -lt $((ALL_FILES / 4)) || { echo "代码包只比 payload 少一点（$CODE_FILES vs $ALL_FILES）—— 分界没生效"; exit 1; }
          # 美术那一半用"名字+内容"的指纹当增量前提：客户端手里的 artDigest 对得上才允许只换代码。
          ART_DIGEST=$(cd "$OUT" && find assets -type f -print0 | sort -z | xargs -0 sha256sum | sha256sum | cut -d' ' -f1)
          CODE_SHA=$(sha256sum "$RUNNER_TEMP/$CODE" | cut -d' ' -f1)
          ART_SIZE=$(du -sb "$OUT/assets" | cut -f1)
          # 清单用 printf 而不是 `node -`（从 stdin 读脚本）：那种写法在这个仓库里没验证过，而 `node -p`
          # 在上面几步已经真跑通。清单本来就是一层薄数据，不需要脚本能力。
          BJ="$OUT/build.json"
          APP=$(node -p "JSON.parse(require('fs').readFileSync('$BJ','utf8')).game.app")
          SERVER=$(node -p "JSON.parse(require('fs').readFileSync('$BJ','utf8')).server")
          COMMIT=$(node -p "JSON.parse(require('fs').readFileSync('$BJ','utf8')).game.commit")
          DESCRIBE=$(node -p "JSON.parse(require('fs').readFileSync('$BJ','utf8')).game.describe")
          CODE_BYTES=$(stat -c %s "$RUNNER_TEMP/$CODE")
          printf '{\n  "schema": 1,\n  "cut": "%s",\n  "version": "%s",\n  "game": { "app": "%s", "commit": "%s", "describe": "%s" },\n  "server": "%s",\n  "code": { "file": "%s", "sha256": "sha256:%s", "files": %s, "bytes": %s },\n  "art": { "digest": "sha256:%s", "files": %s, "bytes": %s },\n  "artFrom": "%s",\n  "minShell": 1,\n  "builtAt": "%s"\n}\n' \
            "$TAG" "$APP" "$APP" "$COMMIT" "$DESCRIBE" "$SERVER" "$CODE" "$CODE_SHA" "$CODE_FILES" "$CODE_BYTES" \
            "$ART_DIGEST" "$ART_FILES" "$ART_SIZE" "$BASE" "$(date -u +%Y-%m-%dT%H:%M:%SZ)" > "$RUNNER_TEMP/$MANIFEST"
          # 自己产的文件自己先验：JSON 少个引号在"打印出来看看"里很容易看不出来，到客户端才炸。
          node -p "JSON.stringify(JSON.parse(require('fs').readFileSync('$RUNNER_TEMP/$MANIFEST','utf8')).code)"
          cat "$RUNNER_TEMP/$MANIFEST"
          echo "ART_DIGEST=sha256:$ART_DIGEST  CODE_SHA=sha256:$CODE_SHA  CODE_FILES=$CODE_FILES  ART_FILES=$ART_FILES  ART_SIZE=$ART_SIZE"
          echo "CODE=$CODE MANIFEST=$MANIFEST" >> "$GITHUB_ENV"

      - name: 存档 build.json 与清单
        uses: actions/upload-artifact@v4
        with:
          name: payload-build-${{ inputs.out_tag }}
          path: |
            ${{ runner.temp }}/www/build.json
            ${{ runner.temp }}/sp-client-manifest-*.json
          if-no-files-found: warn
          retention-days: 30

      - name: 打包并出版(默认不出)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PUBLISH: ${{ inputs.publish }}
          TAG: ${{ inputs.out_tag }}
          ASSET: ${{ inputs.asset_name }}
        run: |
          set -euo pipefail
          OUT="$RUNNER_TEMP/www"
          sha256sum "$OUT/build.json" | awk '{print "build.json sha256=" $1}'
          if [ "$PUBLISH" = 'no' ]; then
            echo "publish=no —— 不建 Release。上面是闸门结果与 build.json,包本身留在 runner 上。"
            cat "$OUT/build.json"
            ls -l "$RUNNER_TEMP"/sp-client-code-*.tar.gz "$RUNNER_TEMP"/sp-client-manifest-*.json
            cat "$RUNNER_TEMP"/sp-client-manifest-*.json
            exit 0
          fi
          # 沿用上一版 tar 的内部结构:解包方式是 `tar -xzf … -C dir`,所以根就是 payload 目录本身。
          tar -czf "$RUNNER_TEMP/$ASSET" -C "$OUT" .
          sha256=$(sha256sum "$RUNNER_TEMP/$ASSET" | awk '{print $1}')
          SIZE=$(stat -c %s "$RUNNER_TEMP/$ASSET")
          echo "tar=$ASSET size=$SIZE sha256=$sha256"
          if gh release view "$TAG" -R lilyco-42/StrongholdProtocolClient >/dev/null 2>&1; then
            echo "$TAG 已经存在 —— 绝不覆盖已发布的资产。换个 tag 再来。"
            exit 1
          fi
          GAME_SHA=$(git -C game rev-parse HEAD)
          DRAFT='--draft'
          if [ "$PUBLISH" = 'ready' ]; then DRAFT=''; fi
          # 一次只传一个资产:多个大资产在同一命令里传,外层超时会在 Release 只建了一半时杀掉它,
          # 而那时 tag 已经写进去了(c28 踩过:`gh release view <tag>` 成功,assets 却是 0)。
          # --target 要的是**本仓(客户端仓)的** ref/commit：Release 建在客户端仓上，GitHub 会拿 target_commitish
          # 去那个仓里找对象。传游戏的 sha 会得到 `HTTP 422 Release.target_commitish is invalid`（实测）。
          # 游戏那一版的出处不靠它：build.json 里带 commit/describe，provenance 闸门已经在判，notes 里再写一遍。
          CLIENT_SHA=$(git rev-parse HEAD)
          NOTES="游戏 $GAME_SHA（${{ inputs.game_repo }}@${{ inputs.game_ref }}），素材来自 ${{ inputs.base_payload_release }}，server=${{ inputs.server }}。由 cut-payload.yml 在 runner 上打出（客户端提交 $CLIENT_SHA）。"
          gh release create "$TAG" "$RUNNER_TEMP/$ASSET" --target "$CLIENT_SHA" --title "payload $(cat /tmp/appver) (${{ inputs.out_tag }})" --notes "$NOTES" $DRAFT
          # 三个资产一起给：整包（装机/发版用）、代码增量（自动更新搬的就是它，几个 MB 而不是 600 MB）、
          # 清单（客户端读的那一份：code.sha256 + art.digest + minShell）。仍然一个一个传，理由同 c28 那次。
          gh release upload "$TAG" "$RUNNER_TEMP/sp-client-code-${TAG#payload-}.tar.gz" -R lilyco-42/StrongholdProtocolClient
          gh release upload "$TAG" "$RUNNER_TEMP/sp-client-manifest-${TAG#payload-}.json" -R lilyco-42/StrongholdProtocolClient
          gh release view "$TAG" -R lilyco-42/StrongholdProtocolClient --json tagName,isDraft,assets \
            --jq '{tagName,isDraft,assets:[.assets[]|{name,size,digest}]}'
