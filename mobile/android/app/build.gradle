apply plugin: 'com.android.application'

// ---------- 固定签名钥匙（upload key）----------
//
// 为什么在这里：这个工程原本一个 signingConfig 都没有，CI 跑的是 `assembleDebug`，于是每个 runner 现场生成一把
// 一次性的 debug keystore。Android 按**签名证书**决定能不能覆盖安装，所以玩家从 c22 升到 c23 必报
// INSTALL_FAILED_UPDATE_INCOMPATIBLE(-7)「与已安装应用签名不同」——只能卸载重装，而 localStorage（代号、干员调配、
// 设置、记住的服务器）就在卸载时没了。一把长期钥匙 + release 签名把这件事一次性修掉。
//
// 钥匙不进仓库：CI 从仓库 secret 解出 mobile/android/keystore/upload-keystore.p12，并写下
// mobile/android/keystore.properties（两者都已 gitignore）。流程与指纹记录见 docs/ANDROID-SIGNING.md。
def keystoreProps = new Properties()
def keystorePropsFile = rootProject.file('keystore.properties')
if (keystorePropsFile.isFile()) {
    keystorePropsFile.withInputStream { keystoreProps.load(it) }
}
def hasUploadKey = keystoreProps.getProperty('storeFile') != null &&
        rootProject.file(keystoreProps.getProperty('storeFile')).isFile()

// AGP 对「release 没配签名」的做法是静默产出一个未签名 APK——装上去会报 INSTALL_FAILED_VERIFICATION_FAILURE，
// 比红一次难看得多，而且它会一路走到玩家手里。所以缺钥匙时让 release 任务直接失败，并说清缺的是什么。
def wantsRelease = gradle.startParameter.taskNames.any { String t -> t.toLowerCase().contains('release') }
if (wantsRelease && !hasUploadKey) {
    throw new GradleException(
        "assembleRelease 需要固定签名钥匙，但没找到。\n" +
        "  期望：mobile/android/keystore.properties 指向一个存在的 .p12（当前 " +
        (keystorePropsFile.isFile() ? "properties 在但文件不在" : "properties 不在") + "）。\n" +
        "  CI 里：仓库 secret ANDROID_KEYSTORE_BASE64 / ANDROID_KEYSTORE_PASSWORD（见 docs/ANDROID-SIGNING.md）。\n" +
        "  本地：./gradlew assembleDebug 不需要这把钥匙。")
}

android {
    namespace = "site.starst.stronghold"
    compileSdk = rootProject.ext.compileSdkVersion
    defaultConfig {
        applicationId "site.starst.stronghold"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode 203
        versionName "0.2.3"
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        aaptOptions {
             // Files and dirs to omit from the packaged assets dir, modified to accommodate modern web apps.
             // Default: https://android.googlesource.com/platform/frameworks/base/+/282e181b58cf72b6ca770dc7ca5f91f135444502/tools/aapt/AaptAssets.cpp#61
            ignoreAssetsPattern = '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~'
        }
    }
    signingConfigs {
        if (hasUploadKey) {
            // 路径按 rootProject（mobile/android/）解析，这样 CI 和开发者本机写 keystore.properties 时不用管模块目录。
            release {
                storeFile = rootProject.file(keystoreProps.getProperty('storeFile'))
                storeType = 'PKCS12'
                storePassword = keystoreProps.getProperty('storePassword')
                keyAlias = keystoreProps.getProperty('keyAlias')
                keyPassword = keystoreProps.getProperty('keyPassword')
            }
        }
    }
    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
            if (hasUploadKey) {
                signingConfig = signingConfigs.release
            }
        }
    }
}

repositories {
    flatDir{
        dirs '../capacitor-cordova-android-plugins/src/main/libs', 'libs'
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    implementation "androidx.coordinatorlayout:coordinatorlayout:$androidxCoordinatorLayoutVersion"
    implementation "androidx.core:core-splashscreen:$coreSplashScreenVersion"
    implementation project(':capacitor-android')
    testImplementation "junit:junit:$junitVersion"
    androidTestImplementation "androidx.test.ext:junit:$androidxJunitVersion"
    androidTestImplementation "androidx.test.espresso:espresso-core:$androidxEspressoCoreVersion"
    implementation project(':capacitor-cordova-android-plugins')
}

apply from: 'capacitor.build.gradle'

try {
    def servicesJSON = file('google-services.json')
    if (servicesJSON.text) {
        apply plugin: 'com.google.gms.google-services'
    }
} catch(Exception e) {
    logger.info("google-services.json not found, google-services plugin not applied. Push Notifications won't work")
}
