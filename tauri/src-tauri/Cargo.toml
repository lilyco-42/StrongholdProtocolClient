[package]
name = "stronghold-protocol-tauri"
version = "0.2.4"
description = "《卫戍协议：盟约》的 Tauri 壳（系统 WebView2，不再自带 Chromium）"
edition = "2021"
rust-version = "1.77"
publish = false

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
# devtools 必须显式开：Tauri 只在 debug 构建里默认给，而玩家报"白屏/立绘没出来"这类问题时要的就是
# release 版里那一层 F12 —— 没有它，出问题的这台机器上没有任何地方能看见错误。
# 不加额外运行时（WebView2 自带检查器），代价只是这个 feature 名写错时编译失败，不会静默少功能。
tauri = { version = "2", features = ["devtools"] }

# lan.rs 用它读构建期写下的 lan-config.json、并拼 /lan/status 的 JSON。**不是新依赖**：
# tauri 自己就依赖 serde_json，这里只是把它提成直接依赖，产物一个字节都不会变大。
# 手写一个 JSON 解析器是这里最容易犯的"重造轮子"——而这份配置是安全相关的（网络口令）。
serde_json = "1"

# 这个壳的存在理由就是省体积，所以发布构建按体积优先。
[profile.release]
opt-level = "z"
lto = "fat"
codegen-units = 1
panic = "abort"
strip = true
